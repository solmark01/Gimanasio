<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222221;--tx:#eee;--mu:#999;--ac:#6fbfae;--acl:#27403a;--bd:#333;--rd:#e5786d}}
:root[data-theme="dark"]{--bg:#171716;--card:#222221;--tx:#eee;--mu:#999;--ac:#6fbfae;--acl:#27403a;--bd:#333;--rd:#e5786d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,sans-serif;max-width:480px;margin:auto;padding:16px 16px 96px}
h1{font-size:22px;margin:8px 0 14px}h2{font-size:15px;color:var(--mu);font-weight:600;margin:18px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid .c{text-align:center;padding:12px 6px;margin:0}
.big{font-size:19px;font-weight:700}.red{color:var(--rd)}.grn{color:var(--ac)}
button,input,select{font:inherit;color:var(--tx)}
.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;width:100%;font-weight:600}
.b.s{background:var(--acl);color:var(--ac)}.b.w{width:auto;padding:8px 12px;font-size:14px}

label{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px;overflow-x:auto}nav button{flex:1;min-width:64px;background:none;border:0;padding:10px 0;font-size:12px;color:var(--mu)}nav button b{display:block;font-size:20px}nav .on{color:var(--ac);font-weight:700}

.cal .d{background:var(--card);border:1px solid var(--bd)}.cal .t{border-color:var(--ac)}.cal .sel{background:var(--ac);color:#fff}.cal .has::after{content:"•";display:block;line-height:4px;font-size:16px}
.bar{height:8px;background:var(--acl);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}

</style></head><body>

<script>
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const money=n=>"$"+Math.round(n).toLocaleString("es-AR");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ranges(){const n=new Date(),t=iso(n),dow=(n.getDay()+6)%7,w=new Date(n);w.setDate(n.getDate()-dow);
 return{t,w:iso(w),m:t.slice(0,8)+"01"}}
function form(title,fields,ok,pv){
 const h=document.createElement("div");h.className="sh";
 h.innerHTML=`<div><div class="row"><b>${title}</b><button class="bk" id="x">Cerrar</button></div>`+fields.map(f=>`<label>${f.l}</label>`+(f.dy?dyH(f):f.dr?drH(f):f.o?(f.s?`<input id="s_${f.k}" placeholder="🔍 Escribí para buscar" autocomplete="off">`:"")+`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}"${o[0]==f.v?" selected":""}>${o[1]}</option>`).join("")}</select>`:`<input id="f_${f.k}" type="${f.t||"text"}" value="${esc(f.v)}"${f.t==="number"?' inputmode="decimal"':""}>`)).join("")+(pv?`<div class="c row" style="background:var(--acl)"><span>Total a cobrar</span><b id="pv"></b></div>`:"")+`<button class="b" id="ok">Guardar</button></div>`;
 const upd=()=>{if(!pv)return;const v={};fields.forEach(f=>v[f.k]=h.querySelector("#f_"+f.k).value.trim());const e=h.querySelector("#pv");if(e)e.textContent=money(pv(v))};
 h.oninput=upd;h.onchange=upd;setTimeout(upd);
 document.body.appendChild(h);
 const norm=t=>String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
 fields.forEach(f=>{const el=h.querySelector("#f_"+f.k);
  if(f.s)h.querySelector("#s_"+f.k).oninput=e=>{const q=norm(e.target.value),cur=el.value,op=f.o.filter(o=>o[0]===""||norm(o[1]).includes(q));
   el.innerHTML=op.map(o=>`<option value="${o[0]}"${o[0]==cur?" selected":""}>${esc(o[1])}</option>`).join("");
   const first=op.find(o=>o[0]!=="");if(q&&first&&!op.some(o=>o[0]!==""&&o[0]==cur))el.value=first[0];
   el.dispatchEvent(new Event("change",{bubbles:true}))};
  if(f.c)el.addEventListener("change",()=>f.c(el.value,(k,x)=>{const t=h.querySelector("#f_"+k);if(t)t.value=x;upd()}))});
 h.onclick=e=>{if(e.target===h)h.remove()};h.querySelector("#x").onclick=()=>h.remove();
 h.querySelector("#ok").onclick=()=>{const v={};fields.forEach(f=>v[f.k]=h.querySelector("#f_"+f.k).value.trim());if(ok(v)!==false){h.remove();save();render()}};
}
async function dl(name,data){try{const u=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){alert("No se pudo descargar");return false}}
const fd=d=>d.split("-").reverse().join("/");
const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const PUB=window.PUB_KEY||null;
const TRIAL=7;
let lic=null,lockMsg="";
const dys=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const addD=(a,n)=>{const d=new Date(a+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const licSave=()=>{try{localStorage.setItem("gimnasio_lic",JSON.stringify(lic))}catch(e){}};
function licInit(){const t=today();try{lic=JSON.parse(localStorage.getItem("gimnasio_lic"))}catch(e){lic=null}
 if(!lic||!lic.id){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(6));lic={id:[...r].map(x=>A[x%32]).join(""),inst:t,until:null,seen:t};licSave()}}
const validUntil=()=>{const tr=addD(lic.inst,TRIAL);return lic.until&&lic.until>tr?lic.until:tr};
const left=()=>dys(today(),validUntil());
function licTick(){const t=today();lockMsg=lic.seen>t&&dys(t,lic.seen)>1?"La fecha del teléfono no es correcta. Corregila para continuar.":"";if(!lockMsg&&lic.seen<t){lic.seen=t;licSave()}}
const isLocked=()=>!!(lockMsg||left()<0);
const b64=x=>Uint8Array.from(atob(x.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function activate(tok){const m=$("#lm"),say=t=>{if(m)m.textContent=t;else alert(t)};
 try{const p=String(tok).trim().split(".");if(p.length!==3)throw"Clave inválida";const[id,u,sg]=p;
  if(id!==lic.id)throw"Esta clave es de otro dispositivo";
  const d=u.slice(0,4)+"-"+u.slice(4,6)+"-"+u.slice(6,8);
  const k=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
  if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,b64(sg),new TextEncoder().encode(id+"."+u)))throw"Clave inválida";
  if(d<today())throw"Esta clave ya venció";
  if(!lic.until||d>lic.until)lic.until=d;licSave();render();if(!m)alert("Listo. Suscripción activa hasta el "+fd(lic.until))
 }catch(e){say(typeof e==="string"?e:"Clave inválida")}}
const lockHtml=()=>`<div style="text-align:center;margin-top:8vh"><div style="font-size:48px">🔒</div><h1>${lockMsg?"Fecha incorrecta":"Suscripción vencida"}</h1><p class="mu">${lockMsg||"Para seguir usando la app, pedí tu clave de activación. Tus datos están guardados y no se pierden."}</p><div class="c"><div class="mu">Tu código de cliente</div><div class="big" style="font-size:30px;letter-spacing:4px">${lic.id}</div></div><div style="text-align:left"><label>Clave de activación</label><input id="lk" placeholder="Pegá la clave acá" autocapitalize="off" autocomplete="off"></div><button class="b" onclick="activate($('#lk').value)">Activar</button><p id="lm" class="red"></p></div>`;
const licTxt=()=>left()<0?"vencida":left()==0?"vence hoy":"quedan "+left()+" día"+(left()==1?"":"s");
const licChip=()=>PUB?`<div class="mu" style="margin:-6px 0 12px">🔑 Licencia: <b class="${left()<=5?"red":"grn"}">${licTxt()}</b></div>`:"";
const banner0=()=>PUB&&left()>=0&&left()<=5?`<div class="c" style="background:var(--acl)">⏳ Tu suscripción vence ${left()==0?"hoy":"en "+left()+" día"+(left()==1?"":"s")}. Pedí tu clave para renovar.</div>`:"";
const renewForm=()=>form("Renovar suscripción",[{k:"k",l:"Clave de activación"}],v=>{activate(v.k)});

let db={socios:[],profs:[],movs:[],asist:[],clases:[],rend:[],lq:[],pcar:[],gastos:[],gmov:[],ing:[],cfg:{cuota:0,gym:"Mi Gimnasio",ns:1,rec:1}};
let ready=false,status="",msg="",tab="home",openS=null,openP=null,openG=null,vinf=false,cv="a",q="",ac="",aq="",im=today().slice(0,7),fl="t",cd=(new Date().getDay()+6)%7,pm=today().slice(0,7);
function save(){try{localStorage.setItem("gimnasio",JSON.stringify(db));status="✓ Guardado en este teléfono"}catch(e){status="⚠ No se pudo guardar"}const el=$("#st");if(el)el.textContent=status}
function load(){try{const l=JSON.parse(localStorage.getItem("gimnasio"));if(l)db=Object.assign(db,l)}catch(e){}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 gen();status="✓ Guardado en este teléfono";ready=true;render()}
const mo=()=>today().slice(0,7),pad=n=>String(n||0).padStart(5,"0"),PL={efe:"Efectivo",tra:"Transferencia",prof:"Transf. al profesor"};
const nM=m=>{let[y,n]=m.split("-").map(Number);n++;if(n>12){n=1;y++}return y+"-"+String(n).padStart(2,"0")};
const pM=m=>{let[y,n]=m.split("-").map(Number);n--;if(n<1){n=12;y--}return y+"-"+String(n).padStart(2,"0")};
const MN=m=>new Date(m+"-15T12:00:00").toLocaleDateString("es-AR",{month:"long",year:"numeric"});
const gs=id=>db.socios.find(s=>s.id===id)||{name:"?",num:0},pn=id=>(db.profs.find(p=>p.id===id)||{}).name||"";
const clTxt=c=>dTxt(c)+" "+hT(c)+" "+c.n+(prT(c)?" · "+prT(c):""),cl_=id=>db.clases.find(c=>c.id===id),sc=s=>(s.cls||[]).map(cl_).filter(Boolean),
cuotaDe=(s,M)=>{M=M||mo();const X=sc(s),St=X.filter(c=>((s.cm||{})[c.id]||"0000-00")<=M),sm=St.reduce((a,c)=>a+((tierOf(s,c)||{}).p||0),0),b=s.cuota||sm||(X.length&&!St.length?0:db.cfg.cuota||0),d=s.dsc;return d&&d.v?Math.max(0,Math.round(b-(d.t==="%"?b*d.v/100:d.v))):b},profDe=s=>s.prof||(sc(s).find(c=>c.p)||{}).p||"",
alum=pid=>db.socios.filter(s=>!s.off&&(s.prof===pid||sc(s).some(c=>c.p===pid))),
dd=c=>c.ds||[c.d||0],dTxt=c=>dd(c).map(i=>DN[i].slice(0,3)).join("/"),dstOf=m=>m.dst||(m.pay==="prof"?"prof":"gim"),
ow=m=>m.amt*(dstOf(m)==="prof"?100-(m.pct||0):(m.pct||0))/100,
pend=pid=>db.movs.filter(m=>m.t==="pago"&&m.prof===pid&&dstOf(m)==="prof").reduce((a,m)=>a+ow(m),0)+db.pcar.filter(c=>c.pid===pid).reduce((a,c)=>a+c.amt,0)-db.rend.filter(r=>r.pid===pid).reduce((a,r)=>a+r.amt,0),
deb=pid=>db.movs.filter(m=>m.t==="pago"&&m.prof===pid&&dstOf(m)!=="prof").reduce((a,m)=>a+ow(m),0)-db.lq.filter(r=>r.pid===pid).reduce((a,r)=>a+r.amt,0),
dyH=f=>`<input id="f_${f.k}" type="hidden" value="${f.v}"><div class="cal" style="margin-bottom:10px">${"LMXJVSD".split("").map((x,i)=>`<span class="d ${f.v.split(",").includes(String(i))?"sel":""}" onclick="dyT(this,${i})">${x}</span>`).join("")}</div>`;
function dyT(e,i){e.classList.toggle("sel");const w=e.parentNode;w.previousElementSibling.value=[...w.children].map((x,j)=>x.classList.contains("sel")?j:"").filter(x=>x!=="").join(",")}
const gname=id=>(db.gastos.find(g=>g.id===id)||{}).name||"?",crM=o=>{const t=parseInt(String(o.id).slice(0,-3),36);return t>1e11?iso(new Date(t)).slice(0,7):""},
caja=()=>[...db.movs.filter(m=>m.t==="pago"&&dstOf(m)!=="prof").map(m=>({id:m.id,d:m.date,a:m.amt,s:1,k:"p",t:"Pago · "+gs(m.sid).name})),...db.rend.map(r=>({id:r.id,d:r.date,a:r.amt,s:1,k:"r",t:"Entrega del profesor · "+pn(r.pid)})),
...db.gmov.filter(m=>m.t==="pago").map(m=>({id:m.id,d:m.date,a:m.amt,s:-1,k:"g",t:"Gasto · "+gname(m.gid)})),...db.lq.map(r=>({id:r.id,d:r.date,a:r.amt,s:-1,k:"l",t:"Pago a profesor · "+pn(r.pid)})),...db.ing.map(r=>({id:r.id,d:r.date,a:r.amt,s:1,k:"i",t:(r.c==="Ingreso"?"Ingreso":"Ingreso · "+r.c)+(ingL(r)?" · "+ingL(r):"")}))],
cs=(f,t,s)=>caja().filter(x=>x.s===s&&x.d>=f&&x.d<=t).reduce((a,x)=>a+x.a,0),egr=(f,t)=>cs(f,t,-1),
gsal=id=>db.gmov.filter(m=>m.gid===id).reduce((a,m)=>a+(m.t==="cargo"?m.amt:-m.amt),0),gtx=b=>b>0?"Debo "+money(b):b<0?"A favor "+money(-b):"Al día";
const gt=g=>g.tipo==="fijo"?"Fijo · vence el día "+g.dia+(g.monto?" · "+money(g.monto):""):"Variable",
vto=()=>{const t=today(),M=t.slice(0,7),lim=addD(t,7);return db.gastos.filter(g=>g.tipo==="fijo"&&g.dia).map(g=>{const m=[M,nM(M)].find(k=>!db.gmov.some(x=>x.gid===g.id&&x.t==="pago"&&x.date.slice(0,7)===k))||nM(nM(M)),[y,n]=m.split("-").map(Number);return{g,d:m+"-"+String(Math.min(g.dia,new Date(y,n,0).getDate())).padStart(2,"0")}}).filter(x=>x.d<=lim).sort((a,b)=>a.d.localeCompare(b.d))};
const hrs=c=>c.hs||[[c.t||"",c.e||""]],hT=c=>hrs(c).map(x=>x[0]+(x[1]?"–"+x[1]:"")).join(" / "),
tiers=c=>c.pl&&c.pl.length?c.pl:(c.pr?[{d:0,p:c.pr}]:[]),tierOf=(s,c)=>tiers(c)[(s.tr||{})[c.id]||0],
tl=t=>t.d?+(t.d/4).toFixed(1)+" días por semana ("+t.d+" al mes) · "+money(t.p):"Mensual · "+money(t.p),
prT=c=>tiers(c).map(t=>t.d?t.d+" clases "+money(t.p):money(t.p)).join(" / "),
ctOpts=()=>db.clases.flatMap(c=>{const T=tiers(c);return(T.length?T:[null]).map((t,i)=>[c.id+"|"+i,dTxt(c)+" "+hT(c)+" · "+c.n+(t?" · "+tl(t):"")])}),
limDe=s=>{const L=sc(s).map(c=>(tierOf(s,c)||{}).d||0);return!L.length||L.includes(0)?0:L.reduce((a,b)=>a+b,0)},
usadas=(s,M)=>db.asist.filter(a=>a.sid===s.id&&a.date.slice(0,7)===M).length,
pTiers=t=>String(t||"").split(/[,;\n]+/).map(x=>x.trim().match(/^(?:(\d+)\s*=\s*)?(\d+(?:[.,]\d+)?)$/)).filter(Boolean).map(m=>({d:+(m[1]||0),p:parseFloat(m[2].replace(",","."))})),
pHs=t=>String(t||"").split(/[,;]+/).map(x=>x.trim().match(/^(\d{1,2}):(\d{2})(?:\s*[-–]\s*(\d{1,2}):(\d{2}))?$/)).filter(Boolean).map(m=>[m[1].padStart(2,"0")+":"+m[2],m[3]?m[3].padStart(2,"0")+":"+m[4]:""]).sort((a,b)=>a[0].localeCompare(b[0])),
crD=o=>{const t=parseInt(String(o.id).slice(0,-3),36);return t>1e11?iso(new Date(t)):"0"},faltas=()=>{const t=today(),out=[];db.socios.filter(s=>!s.off&&sc(s).length).forEach(s=>{const ds=new Set();sc(s).forEach(c=>dd(c).forEach(d=>ds.add(d)));let n=0;for(let i=1;i<=35;i++){const d0=new Date(t+"T12:00:00");d0.setDate(d0.getDate()-i);const d=iso(d0);if(d<=crD(s)||d<(s.start||"0")+"-01")break;if(!ds.has((d0.getDay()+6)%7))continue;if(db.asist.some(a=>a.sid===s.id&&a.date===d))break;n++}if(n>2)out.push({s,n})});return out},
falH=()=>faltas().map(x=>`<div class="c row" style="border-left:4px solid #e53935" onclick="tab='soc';openS='${x.s.id}';render();scrollTo(0,0)"><div><b>⚠ ${esc(x.s.name)}</b><div class="mu">Faltó ${x.n} clases seguidas</div></div></div>`).join(""),
logoH=()=>(db.cfg.logo?`<img src="${db.cfg.logo}" style="height:40px;border-radius:8px;vertical-align:middle;margin-right:10px">`:"")+esc(db.cfg.gym);
function setLogo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);db.cfg.logo=c.toDataURL("image/png");save();render()};im.src=r.result};r.readAsDataURL(f);i.value=""}
const DOPT=()=>[[0,"Sin límite de clases"],...[1,2,3,4,5,6,7].map(n=>[n*4,n+(n>1?" días":" día")+" por semana ("+n*4+" al mes)"])],
drRow=(k,a,b)=>k==="hs"?`<div class="row" style="gap:6px;margin-bottom:6px"><input type="time" value="${a||""}" oninput="drU(this)"><input type="time" value="${b||""}" oninput="drU(this)"><button class="b s w" onclick="drX(this)">✕</button></div>`:`<div class="row" style="gap:6px;margin-bottom:6px"><select onchange="drU(this)">${(!a||DOPT().some(o=>o[0]==a)?DOPT():[...DOPT(),[a,a+" clases al mes"]]).map(o=>`<option value="${o[0]}"${o[0]==a?" selected":""}>${o[1]}</option>`).join("")}</select><input type="number" inputmode="numeric" placeholder="$ Monto" value="${b||""}" oninput="drU(this)"><button class="b s w" onclick="drX(this)">✕</button></div>`,
drH=f=>{const v=f.v||"",hs=f.dr==="hs",R=hs?v.split(",").map(x=>x.trim()).filter(Boolean).map(x=>x.split("-")):pTiers(v).map(t=>[t.d,t.p]);return`<div class="dr" data-k="${f.dr}"><input type="hidden" id="f_${f.k}" value="${esc(v)}"><div class="drl">${(R.length?R:[[]]).map(r=>drRow(f.dr,r[0],r[1])).join("")}</div><button class="b s" style="margin-bottom:10px" onclick="drA(this)">+ ${hs?"Agregar horario":"Agregar precio"}</button></div>`};

 <h2>Informe</h2><div class="c"><button class="b" onclick="vinf=true;render();scrollTo(0,0)">📊 Ver informe mensual</button><button class="b s" style="margin-top:8px" onclick="vinf='g';render();scrollTo(0,0)">💸 Ver informe de gastos</button></div>
 <h2>Gimnasio</h2><div class="c"><div class="row"><span class="mu">Nombre</span><b>${esc(db.cfg.gym)}</b></div><div class="row" style="margin-top:6px"><span class="mu">Cuota mensual general</span><b>${money(db.cfg.cuota)}</b></div><button class="b s" style="margin-top:10px" onclick="cfgForm()">Editar nombre y cuota</button><label class="b s" style="display:block;text-align:center;margin-top:8px;cursor:pointer">🖼 ${db.cfg.logo?"Cambiar":"Subir"} logo<input type="file" accept="image/*" hidden onchange="setLogo(this)"></label>${db.cfg.logo?`<button class="b s" style="margin-top:8px" onclick="db.cfg.logo='';save();render()">Quitar logo</button>`:""}</div>
 <h2>Suscripción</h2><div class="c"><div class="row"><span class="mu">Código de cliente</span><b>${lic.id}</b></div><div class="row" style="margin-top:6px"><span class="mu">${PUB?(left()>=0?"Activa hasta":"Venció el"):"Sin control de suscripción"}</span><b>${PUB?fd(validUntil()):""}</b></div>${PUB?`<div class="row" style="margin-top:6px"><span class="mu">Días restantes</span><b class="${left()<=5?"red":"grn"}">${Math.max(0,left())}</b></div>`:""}${PUB?`<button class="b s" style="margin-top:10px" onclick="renewForm()">Ingresar clave de renovación</button>`:""}</div>
 <h2>Soporte</h2><div class="c"><p class="mu" style="margin-top:0">Si tenés algún problema o consulta con el sistema, escribinos por WhatsApp al <b>3442 674484</b>.</p><button class="b" onclick="soporte()">💬 Contactar con soporte</button></div>
 <h2>Copia de seguridad</h2><div class="c"><p class="mu" style="margin-top:0">Los datos viven en este teléfono. La copia incluye alumnos, pagos, asistencia, clases y profesores. Guardala en Drive o mandatela por WhatsApp.</p><button class="b" onclick="backup()">Descargar copia completa</button></div>
 <div class="c"><p class="mu" style="margin-top:0">Si cambiás de celular: instalá la app, entrá a Datos y elegí tu archivo de copia. (La suscripción es por celular: el nuevo necesita una clave nueva.)</p><input type="file" accept=".json,application/json" onchange="restore(this)"></div>`}
function render(){
 if(!ready){$("#app").innerHTML='<p class="mu" style="text-align:center;margin-top:40vh">Cargando…</p>';return}
 licTick();if(PUB&&isLocked()){$("#nav").innerHTML="";$("#app").innerHTML=lockHtml();return}
 $("#app").innerHTML=banner()+{home,soc:socios,asi,cla,pro,gas:gastos,dat}[tab]()+`<p class="mu" id="st" style="text-align:center;margin-top:18px">${status}</p>`;
 $("#nav").innerHTML=tabs.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="tab='${t[0]}';openS=null;openP=null;openG=null;vinf=false;msg='';render();scrollTo(0,0)"><b>${t[1]}</b>${t[2]}</button>`).join("")}
licInit();render();load();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
